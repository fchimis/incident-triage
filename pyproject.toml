[project]
name = "incident-triage"
version = "0.1.0"
description = "Structured incident triage workflow using Gemini — Inference Group AI Engineer challenge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Candidate" }]

dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Live Gemini calls. Not needed for tests, the demo or CI —
# MockGeminiClient exercises every code path offline.
live = [
    "google-genai>=0.3",
    "python-dotenv>=1.0",
]

# Dev / test tooling.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
# `uv run triage` after `uv sync` — same effect as `python scripts/run_demo.py`.
triage = "incident_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_triage"]

# ---------------------------------------------------------------------------
# Test config
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines are fine in prompts / docstrings
